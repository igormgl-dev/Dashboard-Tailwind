<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./output.css" />
    <title>Meu Dashboard</title>
  </head>
  <body class="bg-zinc-900 text-white">
    <div class="flex h-screen">
      <!-- SIDEBAR -->
      <aside class="w-64 bg-zinc-800 p-5 flex flex-col justify-between">
        <div>
          <h2 class="text-2xl font-bold mb-10">Timetable</h2>

          <nav class="space-y-3">
            <a
              href="#"
              class="flex items-center gap-3 p-2 rounded-lg hover:bg-zinc-700 transition"
            >
              📊 <span>Dashboard</span>
            </a>
            <a
              href="#"
              class="flex items-center gap-3 p-2 rounded-lg hover:bg-zinc-700 transition"
            >
              📅 <span>Agendamentos</span>
            </a>
            <a
              href="#"
              class="flex items-center gap-3 p-2 rounded-lg hover:bg-zinc-700 transition"
            >
              👤 <span>Clientes</span>
            </a>
          </nav>
        </div>

        <div>
          <button
            class="w-full p-2 bg-red-500 rounded-lg hover:bg-red-600 transition cursor-pointer"
          >
            Sair
          </button>
        </div>
      </aside>

      <!-- Conteúdo Principal -->
      <div class="flex-1 flex flex-col">
        <!-- Header -->
        <header class="h-16 bg-zinc-800 flex items-center justify-between px-6">
          <h1 class="text-lg font-semibold">Dashboard</h1>

          <div class="flex items-center gap-4">
            <!-- Barra de Busca -->
            <input
              type="text"
              placeholder="Buscar..."
              class="bg-zinc-700 px-3 py-1 rounded-lg outline-none"
            />

            <!-- Usuário -->
            <div class="w-8 h-8 bg-zinc-600 rounded-full"></div>
          </div>
        </header>

        <!-- Main -->
        <main class="p-6">
          <h2 class="text-2xl font-semibold">Bem vindo</h2>

          <!-- KPIs -->
          <div class="grid grid-cols-3 gap-6 mt-6">
            <div class="bg-zinc-800 p-5 rounded-xl">
              <p class="text-zinc-400">Agendamentos hoje</p>
              <h3 class="text-2x1 font-bold mt-2">12</h3>
            </div>
            <div class="bg-zinc-800 p-5 rounded-xl">
              <p class="text-zinc-400">Clientes ativos</p>
              <h3 class="text-2x1 font-bold mt-2">48</h3>
            </div>
            <div class="bg-zinc-800 p-5 rounded-xl">
              <p class="text-zinc-400">Faturamento</p>
              <h3 class="text-2x1 font-bold mt-2">R$2.300</h3>
            </div>
          </div>

          <div class="flex justify-end mb-6 mt-6">
            <button
              onclick="openModal()"
              class="bg-blue-600 px-4 py-2 rounded-lg hover:bg-blue-700 transition"
            >
              + Novo Agendamento
            </button>
          </div>

          <!-- Tabela de Agendamentos -->

          <div class="mt-5 bg-zinc-800 p-6 rounded-xl">
            <h2 class="text-xl font-semibold mb-6">Agendamentos Recentes</h2>
            <table class="w-full text-left">
              <thead>
                <tr class="text-zinc-400 border-b border-zinc-700">
                  <th class="pb-3">Cliente</th>
                  <th class="pb-3">Serviço</th>
                  <th class="pb-3">Data</th>
                  <th class="pb-3">Status</th>
                  <th class="pb-3">Ações</th>
                </tr>
              </thead>
              <tbody id="appointmentsTable" class="space-y-4"></tbody>
            </table>
          </div>
        </main>
      </div>
    </div>

    <!-- Modal -->

    <div
      id="modal"
      onclick="handleOutsideClick(event)"
      class="hidden fixed inset-0 bg-black/50 items-center justify-center"
    >
      <div
        onclick="event.stopPropagation()"
        class="bg-zinc-800 p-6 rounded-xl w-96"
      >
        <h2 class="text-xl font-semibold mb-4">Novo Agendamento</h2>

        <form onsubmit="addAppointment(event)" action="#" class="space-y-4">
          <input
            id="client"
            type="text"
            placeholder="Nome do cliente"
            class="w-full p-2 bg-zinc-700 rounded-xl outline-none"
          />
          <input
            id="service"
            type="text"
            placeholder="Serviço"
            class="w-full p-2 bg-zinc-700 rounded-xl outline-none"
          />
          <input
            id="date"
            type="date"
            class="w-full p-2 bg-zinc-700 rounded-xl outline-none"
          />
          <select
            id="status"
            class="w-full p-2 bg-zinc-700 rounded-xl outline-none"
          >
            <option value="confirmado">Confirmado</option>
            <option value="pendente">Pendente</option>
            <option value="cancelado">Cancelado</option>
          </select>

          <div class="flex justify-end gap-3 mt-4">
            <button
              type="button"
              onclick="closeModal()"
              class="px-4 py-2 bg-zinc-600 rounded-lg hover:bg-zinc-700"
            >
              Cancelar
            </button>

            <button
              type="submit"
              class="px-4 py-2 bg-blue-600 rounded-lg hover:bg-blue-700"
            >
              Salvar
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- JavaScript  -->

    <script src="script.js"></script>
  </body>
</html>
